name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (keeps our lib/ and pubspec)
        run: |
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          flutter create --platforms=android --project-name glucotrack --org com.glucotrack .
          rm -rf lib test
          cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="GlucoTrack"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: GlucoTrack-apk
          path: build/app/outputs/flutter-apk/app-release.apk
